<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>拓思者 · AI 会议助理</title>
    <style>
      /* 主窗口永不滚动：滚动只发生在内部子区域 */
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        background: #101013;
      }
      /* 实时转写计时器的录音红点呼吸闪烁 */
      @keyframes talksageBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.25; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
