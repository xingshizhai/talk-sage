[package]
name = "talksage-app"
description = "TalkSage v2 Tauri application shell"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "talksage_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true, features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = { workspace = true }
tauri-plugin-updater = { workspace = true }
rfd = "0.15"
serde = { workspace = true }
serde_json = { workspace = true }
sherpa-onnx = "1.13"
log = "0.4"
ureq = { version = "2", features = ["json"] }
talksage-core = { path = "../../crates/talksage-core" }
talksage-config = { path = "../../crates/talksage-config" }
talksage-audio = { path = "../../crates/talksage-audio" }
talksage-pipeline = { path = "../../crates/talksage-pipeline" }
talksage-llm = { path = "../../crates/talksage-llm" }
talksage-knowledge = { path = "../../crates/talksage-knowledge" }
talksage-plugins = { path = "../../crates/talksage-plugins" }
talksage-session = { path = "../../crates/talksage-session" }
talksage-notes = { path = "../../crates/talksage-notes" }
talksage-logging = { path = "../../crates/talksage-logging" }
talksage-asr = { path = "../../crates/talksage-asr" }

# Windows x64 的 whisper.cpp Vulkan GPU 后端（同 Dictata，AMD/Intel/NVIDIA 通吃）。
#
# 刻意不设为默认特性：编译它需要 VULKAN_SDK 环境变量 + LLVM/libclang
# （LIBCLANG_PATH，bindgen 用），CI 的 runner 上两者都没有。以前是在
# Windows x64 上无条件启用的，结果 cargo build --workspace 在 Windows CI 上
# 必然失败（构建脚本直接 panic: Please install Vulkan SDK）。
#
# 开发与打包一律走 scripts/talksage.ps1，它会带上 --features vulkan-gpu，
# 并在此之前自动配好 VULKAN_SDK / LIBCLANG_PATH（见 Ensure-VulkanEnv）。
# 手动 cargo build 出来的 Windows 包不含 GPU 后端，会回退 CUDA/CPU。
#
# macOS 走 whisper-rs Metal；其他平台无 GPU whisper 引擎。
[features]
vulkan-gpu = ["talksage-asr/vulkan-gpu"]
