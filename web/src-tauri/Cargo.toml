[package]
name = "talksage-app"
description = "TalkSage v2 Tauri application shell"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "talksage_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true, features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = { workspace = true }
tauri-plugin-updater = { workspace = true }
rfd = "0.15"
serde = { workspace = true }
serde_json = { workspace = true }
sherpa-onnx = "1.13"
log = "0.4"
ureq = { version = "2", features = ["json"] }
talksage-core = { path = "../../crates/talksage-core" }
talksage-config = { path = "../../crates/talksage-config" }
talksage-audio = { path = "../../crates/talksage-audio" }
talksage-pipeline = { path = "../../crates/talksage-pipeline" }
talksage-llm = { path = "../../crates/talksage-llm" }
talksage-knowledge = { path = "../../crates/talksage-knowledge" }
talksage-plugins = { path = "../../crates/talksage-plugins" }
talksage-session = { path = "../../crates/talksage-session" }
talksage-notes = { path = "../../crates/talksage-notes" }
talksage-logging = { path = "../../crates/talksage-logging" }

# Windows x64：启用 whisper.cpp Vulkan GPU 后端（同 Dictata，AMD/Intel/NVIDIA 通吃）。
# 构建前置：VULKAN_SDK 环境变量 + LLVM/libclang（LIBCLANG_PATH，bindgen 用）。
# macOS 走 whisper-rs Metal；其他平台无 GPU whisper 引擎（talksage-asr 无 feature）。
[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
talksage-asr = { path = "../../crates/talksage-asr", features = ["vulkan-gpu"] }

[target.'cfg(not(all(windows, target_arch = "x86_64")))'.dependencies]
talksage-asr = { path = "../../crates/talksage-asr" }
