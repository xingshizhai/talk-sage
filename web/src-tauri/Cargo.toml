[package]
name = "talksage-app"
description = "TalkSage v2 Tauri application shell"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "talksage_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true, features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sherpa-onnx = "1.13"
log = "0.4"
talksage-core = { path = "../../crates/talksage-core" }
talksage-config = { path = "../../crates/talksage-config" }
talksage-asr = { path = "../../crates/talksage-asr" }
talksage-audio = { path = "../../crates/talksage-audio" }
talksage-pipeline = { path = "../../crates/talksage-pipeline" }
talksage-llm = { path = "../../crates/talksage-llm" }
talksage-knowledge = { path = "../../crates/talksage-knowledge" }
talksage-plugins = { path = "../../crates/talksage-plugins" }
talksage-session = { path = "../../crates/talksage-session" }
talksage-notes = { path = "../../crates/talksage-notes" }
talksage-logging = { path = "../../crates/talksage-logging" }
