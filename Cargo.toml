[workspace]
resolver = "2"
members = [
    "crates/talksage-core",
    "crates/talksage-config",
    "crates/talksage-cli",
    "crates/talksage-asr",
    "crates/talksage-audio",
    "crates/talksage-pipeline",
    "crates/talksage-llm",
    "crates/talksage-knowledge",
    "crates/talksage-plugins",
    "crates/talksage-session",
    "crates/talksage-notes",
    "crates/talksage-server",
    "crates/talksage-logging",
    "web/src-tauri",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = ""

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
toml = "0.8"
thiserror = "2"

# Tauri 2
tauri = { version = "2" }
tauri-build = { version = "2" }
tauri-plugin-opener = "2"
