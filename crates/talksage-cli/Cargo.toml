[package]
name = "talksage-cli"
description = "TalkSage v2 launcher (web / serve / import / record / doctor / version)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "talksage"
path = "src/main.rs"

[dependencies]
talksage-core = { path = "../talksage-core" }
talksage-config = { path = "../talksage-config" }
talksage-asr = { path = "../talksage-asr" }
talksage-pipeline = { path = "../talksage-pipeline" }
talksage-llm = { path = "../talksage-llm" }
talksage-knowledge = { path = "../talksage-knowledge" }
talksage-plugins = { path = "../talksage-plugins" }
talksage-session = { path = "../talksage-session" }
talksage-server = { path = "../talksage-server" }
talksage-logging = { path = "../talksage-logging" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
log = "0.4"
