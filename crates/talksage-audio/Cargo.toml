[package]
name = "talksage-audio"
description = "TalkSage v2 audio capture hub (cpal mic capture, resample, chunking)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
cpal = "0.15"
log = "0.4"
sherpa-onnx = "1.13"
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4", "mp3"] }
talksage-config = { path = "../talksage-config" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Devices_Enumeration",
] }
