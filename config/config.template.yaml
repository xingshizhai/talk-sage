# TalkSage 配置文件模板
#
# 使用方法：
#   Windows: 复制到 C:\Users\<用户名>\.talksage\config.yaml
#   macOS:   复制到 ~/.talksage/config.yaml
#   Linux:   复制到 ~/.talksage/config.yaml
#
# 只需填写你要使用的字段，其余字段会从内置默认值自动读取。

# ── 语音识别 ──────────────────────────────────────────────────────────────────
transcribe:
  # local = 本地双引擎；cloud = OpenAI 兼容 Whisper API（按 3 秒块上传）
  mode: local
  cloud:
    api_key: ""                              # mode: cloud 时必填
    base_url: https://api.openai.com/v1      # 也可换成其他兼容端点
    model: whisper-1

  # 客户声音（英文）（mode: local）
  client:
    engine: faster-whisper  # faster-whisper | parakeet | bitnet
    model: small            # whisper 尺寸；parakeet 用 nemo-parakeet-tdt-0.6b-v3
    device: auto            # auto（启动探测 GPU）/ cpu / cuda
    compute_type: auto      # 仅 faster-whisper：auto / int8 / float16
    vad_filter: true

  # 用户声音（中文）→ FunASR Paraformer
  user:
    model: paraformer-zh  # paraformer-zh（离线）/ paraformer-zh-streaming（流式）
    device: auto          # auto / cpu / cuda

  # 系统声音回环（视频会议场景，捕获扬声器输出作为客户声源）
  loopback:
    enabled: false        # 改为 true 启用（适用于视频会议）
    device: null          # null = 自动检测 Stereo Mix / WASAPI Loopback
                          # 也可以填写设备编号，运行 python -c "import sounddevice; print(sounddevice.query_devices())" 查看

  # BitNet CPU（VibeASR.cpp）— 可选；导入默认优先
  bitnet:
    binary: ""            # asr_infer.exe 完整路径；或设 TALKSAGE_VIBEASR_ROOT
    vae_model: ""         # vibeasr-vae-encoder-i8_s.gguf
    lm_model: ""          # vibeasr-lm-i2_s-embed-q6_k.gguf
    threads: 4
    timeout_seconds: 600
  import:
    prefer_bitnet: true

# ── LLM 提供商 ────────────────────────────────────────────────────────────────
llm:
  default: deepseek   # 默认提供商，插件未单独指定时使用

  providers:
    # DeepSeek（推荐，中文理解好，速度快）
    deepseek:
      base_url: https://api.deepseek.com/v1
      api_key: ""       # 填入你的 DeepSeek API Key
      model: deepseek-chat

    # Kimi / 月之暗面（长上下文）
    kimi:
      base_url: https://api.moonshot.cn/v1
      api_key: ""       # 填入你的 Kimi API Key
      model: moonshot-v1-32k

    # MiniMax
    minimax:
      base_url: https://api.minimax.chat/v1
      api_key: ""       # 填入你的 MiniMax API Key
      model: abab6.5s-chat

    # Claude / Anthropic（谈判分析、技术评估效果好）
    claude:
      base_url: null    # 留空使用官方端点
      api_key: ""       # 填入你的 Anthropic API Key
      model: claude-sonnet-4-6

    # Groq（速度极快，适合术语解释、翻译）
    groq:
      base_url: https://api.groq.com/openai/v1
      api_key: ""       # 填入你的 Groq API Key
      model: llama3-70b-8192

    # Ollama（本地离线，无需 API Key）
    ollama:
      base_url: http://localhost:11434/v1
      api_key: ollama   # 固定值，不需要修改
      model: llama3     # 替换为你本地已拉取的模型名

# ── 插件开关 ──────────────────────────────────────────────────────────────────
plugins:
  # 术语解释：识别英文缩写（NPI、BOQ 等）并用中文解释
  term_explainer:
    enabled: true
    llm: deepseek     # 指定使用哪个提供商
    cooldown_seconds: 10  # 两次 LLM 解释的最短间隔，避免刷屏

  # 实时翻译（Phase 2，暂未实现）
  translator:
    enabled: false
    llm: groq

  # 技术方案评估（Phase 2，暂未实现）
  tech_evaluator:
    enabled: false
    llm: claude

  # 商务谈判分析（Phase 2，暂未实现）
  negotiation_analyzer:
    enabled: false
    llm: claude

# ── 隐私 ──────────────────────────────────────────────────────────────────────
privacy:
  # 首次点击「开始监听」时会弹出同意确认；同意后写入 true
  recording_consent_accepted: false
  # Windows：尽量让本窗口不被屏幕共享/截屏捕获（对方看不到侧边栏）
  # macOS / Linux：请使用「共享特定窗口」并勿共享 TalkSage；见 README
  hide_from_screen_share: true

# ── 会话落盘 ──────────────────────────────────────────────────────────────────
session:
  auto_save: true   # 写入 ~/.talksage/sessions/<时间戳>.md
  sqlite: true      # 同步写入 sessions.db，可用「历史」搜索
  notes_llm: null   # 生成纪要使用的 LLM；null = llm.default

# ── 客户简报知识库（可选）────────────────────────────────────────────────────
knowledge_base:
  enabled: false
  folder: ""        # 指向含 .md / .txt 的文件夹

# ── 首次设置 ──────────────────────────────────────────────────────────────────
setup:
  completed: false  # 完成向导后自动设为 true；改回 false 可再次弹出

# ── 音频设备与处理 ────────────────────────────────────────────────────────────
audio:
  mic_device: null        # null = 默认麦；或 sounddevice 设备编号（也可在 UI「设置」里选）
  ducking:
    enabled: true         # 系统音响时压低麦克风，减轻串音
    threshold: 0.04
    factor: 0.35
  soft_limit:
    enabled: true         # 防削波
    threshold: 0.95
  crosstalk:
    similarity_threshold: 0.6
    window_seconds: 8
