transcribe:
  # local = faster-whisper + FunASR；cloud = OpenAI 兼容 /audio/transcriptions
  mode: local
  cloud:
    api_key: ""
    base_url: https://api.openai.com/v1
    model: whisper-1
  # client stream: English
  client:
    engine: faster-whisper  # faster-whisper | parakeet | bitnet
    model: small          # whisper: tiny/base/small/...；parakeet: nemo-parakeet-tdt-0.6b-v3
    device: auto          # auto / cpu / cuda（auto 启动时探测 GPU）
    compute_type: auto    # auto / int8 / float16 / float32（仅 faster-whisper）
    vad_filter: true
  # user stream: Chinese, uses FunASR Paraformer
  user:
    model: paraformer-zh  # paraformer-zh / paraformer-zh-streaming
    device: auto          # auto / cpu / cuda
  # system audio loopback capture (video calls)
  loopback:
    enabled: false
    device: null          # null = auto-detect; or set to sounddevice device index
  # VibeVoice-ASR-BitNet via VibeASR.cpp (optional CPU engine)
  bitnet:
    binary: ""            # asr_infer 路径；空则 PATH / ~/.talksage/vibeasr / TALKSAGE_VIBEASR_ROOT
    vae_model: ""         # vibeasr-vae-encoder-i8_s.gguf
    lm_model: ""          # vibeasr-lm-i2_s-embed-q6_k.gguf
    threads: 4
    timeout_seconds: 600
  import:
    prefer_bitnet: true   # 导入音频时优先 BitNet（不可用则回退 client 引擎）

llm:
  default: deepseek
  providers:
    claude:
      base_url: null
      api_key: ""
      model: claude-sonnet-4-6
    deepseek:
      base_url: https://api.deepseek.com/v1
      api_key: ""
      model: deepseek-chat
    kimi:
      base_url: https://api.moonshot.cn/v1
      api_key: ""
      model: moonshot-v1-32k
    minimax:
      base_url: https://api.minimax.chat/v1
      api_key: ""
      model: abab6.5s-chat
    groq:
      base_url: https://api.groq.com/openai/v1
      api_key: ""
      model: llama3-70b-8192
    ollama:
      base_url: http://localhost:11434/v1
      api_key: ollama
      model: llama3

plugins:
  term_explainer:
    enabled: true
    llm: deepseek
    cooldown_seconds: 10   # 两次术语解释 LLM 调用的最短间隔（秒）
  translator:
    enabled: false
  tech_evaluator:
    enabled: false
  negotiation_analyzer:
    enabled: false

privacy:
  recording_consent_accepted: false
  hide_from_screen_share: true   # Windows: 尽量排除窗口被屏幕捕获；macOS/Linux 见 README

session:
  auto_save: true   # 监听期间自动写入 ~/.talksage/sessions/*.md
  sqlite: true      # 同步写入 ~/.talksage/sessions.db（可搜索历史）
  notes_llm: null   # null = 使用 llm.default

knowledge_base:
  enabled: false
  folder: ""        # 客户简报 .md/.txt 文件夹

setup:
  completed: false  # 首次启动向导完成后为 true

audio:
  mic_device: null              # null = 系统默认麦克风；或 sounddevice 设备编号
  ducking:
    enabled: true
    threshold: 0.04
    factor: 0.35
  soft_limit:
    enabled: true
    threshold: 0.95
  crosstalk:
    similarity_threshold: 0.6   # 用户转写与近期客户转写 Jaccard 相似度超过则丢弃（回声）
    window_seconds: 8
